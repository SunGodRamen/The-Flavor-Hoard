name: Update Recipe Index

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-index.yml'
      - 'README.md'
      - 'desserts/**/*.md'
      - 'drinks/**/*.md'
      - 'gatherings/**/*.md'
      - 'mains/**/*.md'
      - 'salads/**/*.md'
      - 'sauces/**/*.md'
      - 'sides/**/*.md'
      - 'starters/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate recipe index (MD + JSON)
        shell: bash
        run: |
          set -eo pipefail
          shopt -s globstar nullglob

          DIRS=(desserts drinks gatherings mains salads sauces sides starters)
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Generating at $NOW"

          # ----- JSON -----
          JSON_PATH="recipes.json"
          {
            echo '{'
            echo '  "generated_at": "'"$NOW"'",'
            echo '  "categories": {'
            for i in "${!DIRS[@]}"; do
              d="${DIRS[$i]}"
              [[ $i -gt 0 ]] && echo ','
              echo -n '    "'$d'": ['

              c=0
              for f in "$d"/*.md "$d"/**/*.md; do
                [[ -f "$f" ]] || continue
                [[ $c -gt 0 ]] && echo -n ', '
                printf '"%s"' "$f"
                ((c++))
              done

              echo -n ']'
            done
            echo
            echo '  }'
            echo '}'
          } > "$JSON_PATH"

          # ----- Markdown -----
          MD_PATH="recipe_index.md"
          {
            echo "<!-- machine-index: see recipes.json; generated $NOW -->"
            echo "# Recipe Index"
            echo
            echo "_Auto-generated on $NOW (UTC). Edit recipes in category folders; this file updates on push._"
            echo

            total=0
            for d in "${DIRS[@]}"; do
              echo "## ${d^}"
              count=0
              for f in "$d"/*.md "$d"/**/*.md; do
                [[ -f "$f" ]] || continue
                title="$(grep -m1 '^# ' "$f" | sed 's/^# \s*//;s/\r$//')"
                [[ -n "$title" ]] || title="$(basename "$f" .md)"
                echo "- [${title}]($f)"
                ((count++))
                ((total++))
              done
              [[ $count -eq 0 ]] && echo "_(no recipes yet)_"
              echo
            done
            echo "**Total recipes:** $total"
          } > "$MD_PATH"

          if git diff --quiet -- "$MD_PATH" "$JSON_PATH"; then
            echo "No index changes."
            exit 0
          fi

          git config user.name "FlavorHoardBot"
          git config user.email "flavorhoardbot@example.com"
          git add "$MD_PATH" "$JSON_PATH"
          git commit -m "chore(index): auto-update recipe index ($NOW)"
          git push
