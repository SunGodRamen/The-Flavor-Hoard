name: Update Recipe Index

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/update-index.yml'
      - 'README.md'
      - 'desserts/**/*.md'
      - 'drinks/**/*.md'
      - 'gatherings/**/*.md'
      - 'mains/**/*.md'
      - 'salads/**/*.md'
      - 'sauces/**/*.md'
      - 'sides/**/*.md'
      - 'starters/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate recipe index (MD + JSON)
        shell: bash
        run: |
          # Runner forces -e; turn it off to prevent falsey tests from exiting
          set +e
          set -o pipefail
          set -x
          shopt -s globstar nullglob

          DIRS=(desserts drinks gatherings mains salads sauces sides starters)
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Generating at $NOW"

          # ----- JSON -----
          JSON_PATH="recipes.json"
          {
            echo '{'
            echo '  "generated_at": "'"$NOW"'",'
            echo '  "categories": {'

            for i in "${!DIRS[@]}"; do
              d="${DIRS[$i]}"
              if (( i > 0 )); then echo ','; fi
              echo -n '    "'$d'": ['

              sep=""
              for f in "$d"/*.md "$d"/**/*.md; do
                if [[ -f "$f" ]]; then
                  printf '%s"%s"' "$sep" "$f"
                  sep=", "
                fi
              done

              echo -n ']'
            done

            echo
            echo '  }'
            echo '}'
          } > "$JSON_PATH"

          # ----- Markdown -----
          MD_PATH="recipe_index.md"
          {
            echo "<!-- machine-index: see recipes.json; generated $NOW -->"
            echo "# Recipe Index"
            echo
            echo "_Auto-generated on $NOW (UTC). Edit recipes in category folders; this file updates on push._"
            echo

            total=0
            for d in "${DIRS[@]}"; do
              cap="$(printf "%s" "$d" | head -c1 | tr '[:lower:]' '[:upper:]')$(printf "%s" "$d" | cut -c2-)"
              echo "## $cap"
              count=0
              for f in "$d"/*.md "$d"/**/*.md; do
                if [[ -f "$f" ]]; then
                  title="$(grep -m1 '^# ' "$f" || true)"
                  title="${title#\# }"
                  if [[ -z "$title" ]]; then title="$(basename "$f" .md)"; fi
                  echo "- [${title}]($f)"
                  ((count++))
                  ((total++))
                fi
              done
              if (( count == 0 )); then echo "_(no recipes yet)_"; fi
              echo
            done
            echo "**Total recipes:** $total"
          } > "$MD_PATH"

          # ----- Commit if changed -----
          if git diff --quiet -- "$MD_PATH" "$JSON_PATH"; then
            echo "No index changes."
          else
            git config user.name "FlavorHoardBot"
            git config user.email "flavorhoardbot@example.com"
            git add "$MD_PATH" "$JSON_PATH"
            git commit -m "chore(index): auto-update recipe index ($NOW)" || true
            git push
          fi
